[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ai-assistant"
version = "0.1.0"
description = "An MCP-powered AI Assistant using Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "PyGithub>=2.1.0",
    "duckduckgo-search>=6.0.0",
]

[project.scripts]
mcp-assistant = "mcp_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_assistant"]
